<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>应用落点 · 演示</title><style>
:root{font-family:"Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;color:#18202c;background:#edf1f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:36px}.frame{width:min(100%,980px);min-height:650px;background:rgba(250,251,253,.94);border:1px solid #fff;border-radius:18px;box-shadow:0 28px 80px #34486620,0 2px 12px #34486612;overflow:hidden;position:relative}.top{height:58px;display:flex;align-items:center;padding:0 30px;border-bottom:1px solid #dce2ea90;gap:12px}.brand{font-size:15px;font-weight:650;letter-spacing:.02em}.badge{font-size:11px;color:#687586;background:#e9edf2;padding:4px 8px;border-radius:5px}.controls{margin-left:auto;color:#9da8b5;font-size:14px;letter-spacing:8px}.content{max-width:678px;margin:auto;padding:44px 32px 50px}.eyebrow{color:#0866e8;font-size:12px;font-weight:700;letter-spacing:.08em}.title{font-size:32px;letter-spacing:-.04em;font-weight:650;margin:12px 0 6px;line-height:1.2}.sub{font-size:14px;color:#7a8796;margin:0 0 30px}.drop{height:224px;border:1.5px dashed #bcc9d8;border-radius:14px;background:#f8fafc;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:background .25s,border-color .25s;position:relative}.drop.over{border-color:#0866e8;background:#eff6ff}.package{width:70px;height:70px;border-radius:18px;background:#e8f1ff;color:#0866e8;display:grid;place-items:center;margin-bottom:15px}.package svg{width:38px;height:38px}.drop-title{font-size:16px;font-weight:650}.drop-sub{font-size:13px;color:#8995a3;margin-top:7px}.file{display:none;align-items:center;gap:12px;padding:13px 16px;background:#fff;border:1px solid #e1e7ef;border-radius:10px;box-shadow:0 4px 15px #43546c0b}.file strong{font-size:14px}.file small{display:block;color:#8b97a5;margin-top:4px}.file-icon{color:#0866e8}.drop.loaded .placeholder{display:none}.drop.loaded .file{display:flex}.placeholder{display:flex;align-items:center;flex-direction:column}.label{font-size:13px;font-weight:650;margin:25px 0 9px}.destination{display:flex;align-items:center;gap:12px;background:white;border:1px solid #dce3eb;border-radius:10px;padding:12px 14px;min-width:0}.folder-icon{color:#8696a8;flex:none}.path{font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#495769}.browse{border:0;background:#f1f4f7;border-radius:7px;padding:8px 12px;color:#445268;font:inherit;font-size:12px;white-space:nowrap}.footer{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:22px}.hint{color:#93a0ae;font-size:12px;line-height:1.5}.cta,.replay{border:0;border-radius:9px;font:inherit;cursor:pointer}.cta{background:#0866e8;color:white;font-weight:650;font-size:14px;padding:12px 25px;white-space:nowrap;box-shadow:0 4px 10px #0866e82c}.cta:active,.replay:active{transform:scale(.97)}.result{margin-top:18px;background:#eef8f3;border:1px solid #d7eee1;border-radius:10px;padding:13px 15px;color:#26714c;font-size:13px;line-height:1.6;display:none}.result.show{display:block}.result strong{display:block}.result span{color:#4b7562;overflow-wrap:anywhere}.ghost{position:absolute;left:0;top:0;z-index:4;pointer-events:none;opacity:0;display:flex;align-items:center;gap:8px;background:#fff;padding:10px 12px;border-radius:9px;box-shadow:0 9px 28px #233c5c2f;font-size:12px;font-weight:600;white-space:nowrap}.cursor{position:absolute;z-index:5;left:0;top:0;pointer-events:none;opacity:0;filter:drop-shadow(0 2px 2px #0004)}.replay{position:absolute;right:20px;bottom:16px;background:#edf2f8;color:#566779;padding:8px 12px;font-size:12px}.status{position:absolute;left:30px;bottom:24px;font-size:11px;color:#9aa6b3}@media(max-width:600px){body{padding:0;background:#fafbfd}.frame{border:0;border-radius:0;min-height:100vh;box-shadow:none}.top{padding:0 20px}.content{padding:35px 20px 100px}.title{font-size:27px}.drop{height:210px}.footer{align-items:flex-start;flex-direction:column}.cta{width:100%}.status{left:20px}.replay{right:20px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.ghost,.cursor{display:none!important}}
</style></head><body><main class="frame" id="stage"><div class="top"><span class="brand">应用落点</span><span class="badge">交互演示</span><span class="controls" aria-hidden="true">— □ ×</span></div><div class="content"><div class="eyebrow">更自在的安装方式</div><div class="title">安装到你选的位置</div><p class="sub">把安装包放进来，其余的交给应用落点。</p><div class="drop" id="drop"><div class="placeholder"><div class="package"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="m3 7 9-4 9 4v10l-9 4-9-4z"/><path d="m3 7 9 4 9-4M12 11v10M7.5 5l9 4"/></svg></div><div class="drop-title">拖放安装包到这里</div><div class="drop-sub">支持常见安装包与压缩包</div></div><div class="file"><svg class="file-icon" width="28" height="32" viewBox="0 0 24 28" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 1h10l6 6v20H4z"/><path d="M14 1v6h6M10 11h4M10 15h4M10 19h4"/></svg><div><strong>示例工具.zip</strong><small>已选择安装包</small></div></div></div><div class="label">安装位置</div><div class="destination"><svg class="folder-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="path">D:\Apps</span><button class="browse" id="browse" type="button">选择文件夹</button></div><div class="footer"><div class="hint">演示模式 · 不会读取或安装文件</div><button class="cta" id="start" type="button">开始安装</button></div><div class="result" id="result" role="status"><strong>✓ 演示完成</strong><span>安装位置：D:\Apps\示例工具</span></div></div><span class="status">仅供界面展示</span><button class="replay" id="replay" type="button">重新播放</button><div class="ghost" id="ghost"><span class="file-icon">▤</span>示例工具.zip</div><svg class="cursor" id="cursor" width="24" height="32" viewBox="0 0 24 32"><path d="M3 2v23l5-5 4 9 4-2-4-9h7z" fill="#1c2733" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></main><script>
(()=>{const stage=document.querySelector('#stage'),drop=document.querySelector('#drop'),ghost=document.querySelector('#ghost'),cursor=document.querySelector('#cursor'),result=document.querySelector('#result'),start=document.querySelector('#start');let run=0;const wait=ms=>new Promise(r=>setTimeout(r,ms));function point(el,x=.5,y=.5){const a=el.getBoundingClientRect(),b=stage.getBoundingClientRect();return{x:a.left-b.left+a.width*x,y:a.top-b.top+a.height*y}}function pos(el,p){el.style.transform=`translate(${p.x}px,${p.y}px)`}function reset(){drop.classList.remove('loaded','over');result.classList.remove('show');start.textContent='开始安装';ghost.style.opacity=cursor.style.opacity='0'}async function play(){const id=++run;reset();if(matchMedia('(prefers-reduced-motion: reduce)').matches){drop.classList.add('loaded');result.classList.add('show');start.textContent='已完成';return}const target=point(drop,.5,.43),from={x:Math.max(12,target.x-220),y:Math.max(65,target.y-120)};pos(ghost,from);pos(cursor,{x:from.x+18,y:from.y+10});ghost.style.opacity=cursor.style.opacity='1';await wait(650);if(id!==run)return;ghost.style.transition=cursor.style.transition='transform 1.4s cubic-bezier(.25,.65,.25,1)';pos(ghost,target);pos(cursor,{x:target.x+18,y:target.y+10});await wait(1050);if(id!==run)return;drop.classList.add('over');await wait(350);if(id!==run)return;ghost.style.opacity='0';drop.classList.remove('over');drop.classList.add('loaded');await wait(700);if(id!==run)return;let dest=point(document.querySelector('#browse'));pos(cursor,dest);await wait(700);if(id!==run)return;let action=point(start);pos(cursor,action);await wait(1100);if(id!==run)return;start.textContent='正在准备…';await wait(850);if(id!==run)return;result.classList.add('show');start.textContent='已完成';await wait(500);if(id!==run)return;cursor.style.opacity='0';ghost.style.transition=cursor.style.transition='none'}document.querySelector('#replay').onclick=play;document.querySelector('#browse').onclick=()=>{++run;reset();drop.classList.add('loaded')};start.onclick=()=>{++run;drop.classList.add('loaded');result.classList.add('show');start.textContent='已完成';ghost.style.opacity=cursor.style.opacity='0'};play()})();
</script></body></html>
